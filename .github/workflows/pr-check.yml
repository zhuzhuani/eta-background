name: PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 可在仓库规则集中将此名称配置为必需检查。
    name: Lint / Test / Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 校验接线并内嵌 root 引擎
        run: |
          bash etax/check_hooks.sh
          bash etax/embed_engine.sh

      # PR 不读取签名 Secrets；耗 CPU 的 lint 在 UI 测试结束后运行。
      - name: 单元测试、Lint 与 Debug 构建
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :app:testDebugUnitTest
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            "-Peta.buildMetadata=etax.${HEAD_SHA::7}" \
            :app:lintDebug :app:assembleDebug

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
